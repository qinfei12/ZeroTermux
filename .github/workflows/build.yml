name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      JAVA_VERSION: "17"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ARCH: arm64
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置 JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}

      - name: 缓存 Bootstrap
        uses: actions/cache@v5
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: bootstrap-${{ hashFiles('app/build.gradle') }}
          restore-keys: bootstrap-

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug 和 Release APK
        run: |
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          ./gradlew --build-cache --parallel --stacktrace :app:assembleDebug :app:assembleRelease -Darch=$ARCH

      - name: 上传 Debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_debug_arm64-v8a
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: 上传 Release APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-Nightly_release_arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: 创建预发行 (Pre-release)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_id }}
          name: ZeroTermux Nightly arm64
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
